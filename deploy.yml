---
- name: Deploy Flask App & Monitoring
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Create app directory
      file:
        path: /home/ubuntu/flask-app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy app files to server
      copy:
        src: "{{ item }}"
        dest: /home/ubuntu/flask-app/{{ item }}
        owner: ubuntu
        group: ubuntu
      loop:
        - app.py
        - requirements.txt

    - name: Install Python dependencies
      pip:
        requirements: /home/ubuntu/flask-app/requirements.txt
        executable: pip3

    - name: Create systemd service file for Flask
      copy:
        dest: /etc/systemd/system/flask-app.service
        content: |
          [Unit]
          Description=Flask DevSecOps App
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/flask-app
          ExecStart=/usr/bin/python3 /home/ubuntu/flask-app/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start and enable Flask app service
      systemd:
        name: flask-app
        state: started
        enabled: yes

    - name: Create prometheus user for Node Exporter
      user:
        name: prometheus
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: Download Node Exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        remote_src: yes
        mode: '0755'
        owner: prometheus
        group: prometheus

    - name: Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=notify
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start Node Exporter
      systemd:
        daemon_reload: yes
        state: restarted
        enabled: yes
        name: node_exporter
