---
- name: Deploy Flask App
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Create app directory
      file:
        path: /home/ubuntu/flask-app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy app files to server
      copy:
        src: ../{{ item }}
        dest: /home/ubuntu/flask-app/{{ item }}
        owner: ubuntu
        group: ubuntu
      loop:
        - app.py
        - requirements.txt

    - name: Install Python dependencies
      pip:
        requirements: /home/ubuntu/flask-app/requirements.txt
        executable: pip3

    - name: Create systemd service file
      copy:
        dest: /etc/systemd/system/flask-app.service
        content: |
          [Unit]
          Description=Flask DevSecOps App
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/flask-app
          ExecStart=/usr/bin/python3 /home/ubuntu/flask-app/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start and enable Flask app service
      systemd:
        name: flask-app
        state: started
        enabled: yes
